        <p>I'm a Forward Deployed Engineer building production-ready AI systems. I currently work at <a href="https://galileo.ai">Galileo</a>, where I work directly with Fortune 100 customers to design, evaluate, and deploy LLM applications in production. My work spans LLM guardrails, evaluation pipelines, monitoring, and cost control, with a focus on reliability and real-world impact.</p>
        <p>Before moving into tech full time, I worked in real estate operations, where I helped scale a boutique brokerage to over $100M in transaction volume.</p>
        <p>Outside of my primary role, I run <a href="https://summitandshark.com/">Summit &amp; Shark, LLC</a>, through which I've built a production AI leasing chatbot for real estate clients and a <a href="https://chrome.google.com/webstore/detail/comp-crunch-analyze-zillo/pfmjlnebociiohfhlpckomcmnajdonjp/">Chrome extension for analyzing Zillow data</a> used by hundreds of users.</p>
